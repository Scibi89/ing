name: ING cookie consent

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/cookie-consent.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/cookie-consent.yml'

permissions:
  contents: read

jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Install browser
        run: mvn -B -ntp test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps ${{ matrix.browser }}"
      - name: Run infrastructure regression tests
        run: mvn -B -ntp test "-Dtest=TestConfigTest,PlaywrightExtensionTest,BrowserMatrixExtensionTest,AnalyticsCookieTest" "-Dbrowser=${{ matrix.browser }}"
      - name: Run recruitment scenario once on the selected browser
        run: mvn -B -ntp verify "-Dtest=AnalyticsCookieConsentTest" "-Dbrowser=${{ matrix.browser }}" -DretainArtifacts=true
      - name: Upload reports and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consent-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/artifacts/
          if-no-files-found: warn
          retention-days: 7
